<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Briefcase Business Icon - Professional Services/Corporate Intent -->
  <defs>
    <metadata>
      <intent_glyph>briefcase_business_icon</intent_glyph>
      <semantic_tags>professional,corporate,business,services,consulting,work</semantic_tags>
      <optimal_industries>consulting,professional_services,corporate,b2b,legal</optimal_industries>
      <asset_version>1.0.0</asset_version>
    </metadata>
  </defs>
  
  <!-- Briefcase body -->
  <rect x="12" y="28" width="40" height="24" 
        fill="currentColor" 
        opacity="0.9"
        rx="2"/>
  
  <!-- Briefcase handle connection -->
  <rect x="24" y="20" width="16" height="8" 
        fill="currentColor" 
        opacity="0.8"/>
  
  <!-- Briefcase handle -->
  <path d="M 26 20 
           C 26 16 30 14 32 14 
           C 34 14 38 16 38 20" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        opacity="0.7"/>
  
  <!-- Lock/clasp -->
  <rect x="30" y="36" width="4" height="6" 
        fill="white" 
        opacity="0.4"
        rx="1"/>
  
  <!-- Bottom detail -->
  <line x1="12" y1="44" x2="52" y2="44" 
        stroke="white" 
        stroke-width="1" 
        opacity="0.3"/>
</svg>
