<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sun Nature Icon - Energy/Brightness/Positive/Solar Intent -->
  <defs>
    <metadata>
      <intent_glyph>sun_nature_icon</intent_glyph>
      <semantic_tags>energy,solar,brightness,positive,renewable,power,vitality</semantic_tags>
      <optimal_industries>solar,renewable_energy,positive_messaging,vitality,outdoor</optimal_industries>
      <asset_version>1.0.0</asset_version>
    </metadata>
  </defs>
  
  <!-- Sun center -->
  <circle cx="32" cy="32" r="12" 
