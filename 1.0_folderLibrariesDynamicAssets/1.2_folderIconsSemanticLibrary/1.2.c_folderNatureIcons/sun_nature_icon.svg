  <line x1="8" y1="32" x2="16" y2="32" 
        stroke="currentColor" 
        stroke-width="3" 
        opacity="0.8"/>
  <line x1="48" y1="32" x2="56" y2="32" 
        stroke="currentColor" 
        stroke-width="3" 
        opacity="0.8"/>
  
  <!-- Sun rays - diagonal directions -->
  <line x1="14" y1="14" x2="20" y2="20" 
        stroke="currentColor" 
        stroke-width="2" 
        opacity="0.7"/>
  <line x1="50" y1="14" x2="44" y2="20" 
        stroke="currentColor" 
        stroke-width="2" 
        opacity="0.7"/>
  <line x1="14" y1="50" x2="20" y2="44" 
