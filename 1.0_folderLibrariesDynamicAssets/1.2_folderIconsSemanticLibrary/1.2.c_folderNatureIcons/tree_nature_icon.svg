<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tree Nature Icon - Growth/Stability/Roots/Nature Intent -->
  <defs>
    <metadata>
      <intent_glyph>tree_nature_icon</intent_glyph>
      <semantic_tags>growth,stability,roots,foundation,nature,longevity,environmental</semantic_tags>
      <optimal_industries>environmental,sustainability,long_term_growth,foundations,natural</optimal_industries>
      <asset_version>1.0.0</asset_version>
    </metadata>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="28" y="32" width="8" height="24" 
        fill="currentColor" 
        opacity="0.8"
        rx="1"/>
  
  <!-- Tree crown - bottom layer -->
  <circle cx="32" cy="28" r="12" 
