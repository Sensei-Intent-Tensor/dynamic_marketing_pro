          opacity="0.7"/>
  
  <!-- Tree crown - middle layer -->
  <circle cx="32" cy="22" r="10" 
          fill="currentColor" 
          opacity="0.8"/>
  
  <!-- Tree crown - top layer -->
  <circle cx="32" cy="16" r="8" 
          fill="currentColor" 
          opacity="0.9"/>
  
  <!-- Ground line -->
  <line x1="16" y1="56" x2="48" y2="56" 
        stroke="currentColor" 
        stroke-width="2" 
        opacity="0.6"/>
  
  <!-- Roots left -->
  <path d="M 28 56 
           C 24 58 20 60 16 56" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        opacity="0.5"/>
  
  <!-- Roots right -->
  <path d="M 36 56 
           C 40 58 44 60 48 56" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        opacity="0.5"/>
