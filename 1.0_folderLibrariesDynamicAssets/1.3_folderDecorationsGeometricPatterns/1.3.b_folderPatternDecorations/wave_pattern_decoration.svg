<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Wave Pattern Decoration - Flowing/Organic/Dynamic Background -->
  <defs>
    <metadata>
      <intent_glyph>wave_pattern_decoration</intent_glyph>
      <semantic_tags>wave,flow,organic,dynamic,movement,fluid</semantic_tags>
      <placement_recommendation>background,full_frame,overlay</placement_recommendation>
      <compatible_geometries>round,mixed</compatible_geometries>
      <asset_version>1.0.0</asset_version>
    </metadata>
  </defs>
  
  <!-- Wave line 1 - top -->
  <path d="M 0 16 
           Q 16 12 32 16 
           Q 48 20 64 16" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        opacity="0.3"/>
  
  <!-- Wave line 2 - middle -->
  <path d="M 0 32 
           Q 16 28 32 32 
           Q 48 36 64 32" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        opacity="0.2"/>
  
  <!-- Wave line 3 - bottom -->
  <path d="M 0 48 
           Q 16 44 32 48 
           Q 48 52 64 48" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        opacity="0.1"/>
  
  <!-- Subtle accent dots -->
  <circle cx="8" cy="16" r="1" 
          fill="currentColor" 
          opacity="0.2"/>
  <circle cx="32" cy="16" r="1" 
          fill="currentColor" 
          opacity="0.2"/>
  <circle cx="56" cy="16" r="1" 
          fill="currentColor" 
          opacity="0.2"/>
</svg>
