<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Grid Pattern Decoration - Structured/Tech/Modern Background -->
  <defs>
    <metadata>
      <intent_glyph>grid_pattern_decoration</intent_glyph>
      <semantic_tags>grid,structure,tech,organized,modern,digital</semantic_tags>
      <placement_recommendation>background,full_frame,repeating_pattern</placement_recommendation>
      <compatible_geometries>sharp,minimal</compatible_geometries>
      <asset_version>1.0.0</asset_version>
    </metadata>
  </defs>
  
  <!-- Vertical grid lines -->
  <line x1="16" y1="0" x2="16" y2="64" 
        stroke="currentColor" 
        stroke-width="1" 
        opacity="0.2"/>
  <line x1="32" y1="0" x2="32" y2="64" 
        stroke="currentColor" 
        stroke-width="1" 
        opacity="0.2"/>
  <line x1="48" y1="0" x2="48" y2="64" 
        stroke="currentColor" 
        stroke-width="1" 
        opacity="0.2"/>
  
  <!-- Horizontal grid lines -->
  <line x1="0" y1="16" x2="64" y2="16" 
        stroke="currentColor" 
        stroke-width="1" 
        opacity="0.2"/>
  <line x1="0" y1="32" x2="64" y2="32" 
        stroke="currentColor" 
        stroke-width="1" 
        opacity="0.2"/>
  <line x1="0" y1="48" x2="64" y2="48" 
        stroke="currentColor" 
        stroke-width="1" 
        opacity="0.2"/>
  
  <!-- Intersection accent points -->
  <circle cx="16" cy="16" r="1.5" 
          fill="currentColor" 
          opacity="0.3"/>
  <circle cx="32" cy="16" r="1.5" 
          fill="currentColor" 
          opacity="0.3"/>
  <circle cx="48" cy="16" r="1.5" 
          fill="currentColor" 
          opacity="0.3"/>
  <circle cx="16" cy="32" r="1.5" 
          fill="currentColor" 
          opacity="0.3"/>
  <circle cx="32" cy="32" r="1.5" 
          fill="currentColor" 
          opacity="0.3"/>
  <circle cx="48" cy="32" r="1.5" 
          fill="currentColor" 
          opacity="0.3"/>
  <circle cx="16" cy="48" r="1.5" 
          fill="currentColor" 
          opacity="0.3"/>
  <circle cx="32" cy="48" r="1.5" 
          fill="currentColor" 
          opacity="0.3"/>
  <circle cx="48" cy="48" r="1.5" 
          fill="currentColor" 
          opacity="0.3"/>
</svg>
